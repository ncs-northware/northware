# This workflow maintains a pull request that prepares a new release.

name: Release Packages with Changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  pull-requests: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install Dependencies
        run: bun install

      - name: Create Release Pull Request
        uses: changesets/action@v2
        with:
          commit-message: "chore(release): New Package Versions"
          pr-title: "chore(release): New Package Versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}