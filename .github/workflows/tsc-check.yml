name: TypeScript Syntax Checks

# This Action Checks for Syntax Issues in TypeScript Files

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  tsc:
    name: TypeScript Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: bun install

      - name: TypeScript Check at Root Level
        run: bun tsc-check:root

      - name: TypeScript Check of Packages and Apps
        run: bun turbo tsc-check