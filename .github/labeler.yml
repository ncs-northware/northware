# This file serves as configuration file for the labeler Workflow (.github/workflows/pr_labeler.yml)

# Labels for Github Health Files

dev-experience:
  - changed-files:
      - any-glob-to-any-file: ".changeset/**"
      - any-glob-to-any-file: ".devcontainer/**"
      - any-glob-to-any-file: ".github/**"
      - any-glob-to-any-file: ".vscode/**"

# Labels for apps/* changes

apps/docs:
  - changed-files:
      - any-glob-to-any-file: apps/docs/**

apps/storybook:
  - changed-files:
      - any-glob-to-any-file: apps/storybook/**

apps/cockpit:
  - changed-files:
      - any-glob-to-any-file: apps/cockpit/**

# Labels for packages/* changes

packages/auth:
  - changed-files:
      - any-glob-to-any-file: packages/auth/**

packages/database and api:
  - changed-files:
      - any-glob-to-any-file: packages/database/**

packages/service-config:
  - changed-files:
      - any-glob-to-any-file: packages/service-config/**

packages/tsconfig:
  - changed-files:
      - any-glob-to-any-file: packages/tsconfig/**

packages/ui:
  - changed-files:
      - any-glob-to-any-file: packages/ui/**
